<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ciudad Escucha · Alternativa B · Conversación primero</title><style>
*{box-sizing:border-box}:root{--ink:#122735;--accent:#725c9b;--pale:#eee9f7;--muted:#66808a}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:#e3eaf0}.note{max-width:550px;margin:12px auto 6px;padding:10px 12px;border-radius:10px;background:white;font-size:12px;line-height:1.35}.phone{width:min(390px,100%);height:min(820px,calc(100dvh - 85px));min-height:490px;margin:8px auto 24px;border:7px solid #182735;border-radius:38px;overflow:hidden;background:#fafcfd;display:flex;flex-direction:column;box-shadow:0 15px 45px #09283e33}.head{background:var(--accent);color:white;padding:21px 17px 18px;flex-shrink:0}.head h1{font-size:22px;margin:0 0 7px}.head p{margin:0;font-size:12px;opacity:.93}.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:15px 15px 24px}.nav{height:63px;flex:0 0 auto;border-top:1px solid #dae5eb;display:grid;grid-template-columns:repeat(3,1fr);background:#fff}button{font:inherit;cursor:pointer}.nav button{border:0;background:none;color:#37515e;font-size:12px}.nav button.active{color:var(--accent);font-weight:bold;background:var(--pale)}.card{background:white;border:1px solid #dae6eb;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 3px 12px #163a440a}.muted{font-size:12px;color:var(--muted)}.primary{width:100%;border:0;border-radius:13px;background:var(--accent);color:#fff;font-weight:bold;padding:14px;min-height:46px;margin:8px 0}.secondary{border:1px solid var(--accent);color:var(--accent);border-radius:12px;background:#fff;padding:10px 12px}.chip{font-size:11px;display:inline-block;border-radius:99px;padding:6px 9px;background:var(--pale);color:var(--accent)}.hidden{display:none}label{display:block;margin:8px 0;font-size:13px;font-weight:bold}input,textarea,select{width:100%;font:inherit;padding:12px;border:1px solid #c6d6dd;border-radius:12px;background:white}h2{font-size:17px;margin:9px 0}p{line-height:1.45}.map{height:320px;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(145deg,#e0e9d4,#d5e4d5)}.map:before{content:'';position:absolute;inset:-25%;background:repeating-linear-gradient(35deg,transparent 0 38px,#fff 40px 52px,transparent 54px 100px),repeating-linear-gradient(128deg,transparent 0 49px,#fff 51px 62px,transparent 64px 109px)}.pin{position:absolute;border:3px solid white;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:var(--accent);color:white;font-weight:bold;box-shadow:0 3px 9px #1235}.bubble{max-width:87%;padding:13px;margin:12px 0;border-radius:17px;background:#e9f0f3;font-size:14px;line-height:1.5}.bubble.me{margin-left:auto;background:var(--accent);color:white}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.step{font-size:11px;color:var(--muted);margin:12px 0}@media(max-width:480px){body{background:white}.note{margin:0;border-radius:0;font-size:10px;padding:7px}.phone{border:0;width:100%;height:calc(100dvh - 48px);min-height:400px;margin:0;border-radius:0;box-shadow:none}}:focus-visible{outline:3px solid #f0a158;outline-offset:2px}</style></head><body><div class="note"><b>PROTOTIPO B</b> · Alternativa conceptual con interacciones limitadas. Solo la alternativa C incluye simulación integral. <a href="alternativas.html">Ver comparación</a></div><section class="phone" aria-label="Prototipo móvil B"><header class="head"><h1>Cuéntanos</h1><p>Diálogo guiado, texto y voz propuesta</p></header><div class="body" id="content"></div><nav class="nav" id="nav" aria-label="Navegación de la alternativa"></nav></section><script>const $=x=>document.querySelector(x);let tab='conversacion',step=0,answer='',replies=['Hay un poste de luz apagado cerca de mi casa.','Los Olivos','Frente al parque del barrio.'];const prompts=['Hola. Cuéntame qué problema urbano encontraste.','¿En qué distrito de Lima ocurrió?','¿Tienes una referencia general del lugar?','Ya tenemos un borrador. Antes de enviarlo habría que revisar los datos.'];function send(){const el=$('#answer');if(!el||!el.value.trim())return;answer=el.value.trim();step=Math.min(3,step+1);render()}function sample(){if(step<3){answer=replies[step];step++;render()}}function render(){const bubbles=`<div class="bubble">${prompts[0]}</div>`+[...Array(step)].map((_,i)=>`<div class="bubble me">${i===step-1?answer:replies[i]}</div><div class="bubble">${prompts[Math.min(i+1,3)]}</div>`).join('');const views={conversacion:`<span class="chip">Ayuda textual · simulación</span><h2>Cuéntanos qué sucede</h2>${bubbles}<p class="muted">El diálogo es conceptual, no utiliza LLM ni reconoce voz.</p>${step<3?`<label for="answer">Tu respuesta</label><textarea id="answer" placeholder="Escribe aquí…"></textarea><div class="row"><button class="secondary" onclick="sample()">Ejemplo de dictado</button></div><button class="primary" onclick="send()">Enviar respuesta</button>`:`<div class="card"><b>Borrador listo para revisión</b><p>Esta alternativa ilustra el diálogo, pero no completa una publicación municipal.</p></div><button class="primary" onclick="step=0;answer='';render()">Reiniciar conversación</button>`}`,actividad:`<h2>Actividad reciente</h2><div class="card">Los Olivos · Luminaria sin luz <p class="muted">Reporte ficticio para ilustrar cómo continuaría la experiencia.</p></div>`,ajustes:`<h2>Accesibilidad conversacional</h2><div class="card">Preferencias propuestas: voz opcional, subtítulos del diálogo, ritmo ajustable y salida de texto para ruido ambiental.</div>`};$('#content').innerHTML=views[tab];$('#nav').innerHTML=[['conversacion','Dialogar'],['actividad','Actividad'],['ajustes','Ayuda']].map(([key,label])=>`<button class="${tab===key?'active':''}" onclick="tab='${key}';render()">${label}</button>`).join('')}render();</script></body></html>
