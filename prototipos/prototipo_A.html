<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ciudad Escucha · Alternativa A · Mapa primero</title><style>
*{box-sizing:border-box}:root{--ink:#122735;--accent:#126a82;--pale:#dff3f5;--muted:#66808a}body{margin:0;font-family:Arial,sans-serif;color:var(--ink);background:#e3eaf0}.note{max-width:550px;margin:12px auto 6px;padding:10px 12px;border-radius:10px;background:white;font-size:12px;line-height:1.35}.phone{width:min(390px,100%);height:min(820px,calc(100dvh - 85px));min-height:490px;margin:8px auto 24px;border:7px solid #182735;border-radius:38px;overflow:hidden;background:#fafcfd;display:flex;flex-direction:column;box-shadow:0 15px 45px #09283e33}.head{background:var(--accent);color:white;padding:21px 17px 18px;flex-shrink:0}.head h1{font-size:22px;margin:0 0 7px}.head p{margin:0;font-size:12px;opacity:.93}.body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:15px 15px 24px}.nav{height:63px;flex:0 0 auto;border-top:1px solid #dae5eb;display:grid;grid-template-columns:repeat(3,1fr);background:#fff}button{font:inherit;cursor:pointer}.nav button{border:0;background:none;color:#37515e;font-size:12px}.nav button.active{color:var(--accent);font-weight:bold;background:var(--pale)}.card{background:white;border:1px solid #dae6eb;border-radius:16px;padding:14px;margin:10px 0;box-shadow:0 3px 12px #163a440a}.muted{font-size:12px;color:var(--muted)}.primary{width:100%;border:0;border-radius:13px;background:var(--accent);color:#fff;font-weight:bold;padding:14px;min-height:46px;margin:8px 0}.secondary{border:1px solid var(--accent);color:var(--accent);border-radius:12px;background:#fff;padding:10px 12px}.chip{font-size:11px;display:inline-block;border-radius:99px;padding:6px 9px;background:var(--pale);color:var(--accent)}.hidden{display:none}label{display:block;margin:8px 0;font-size:13px;font-weight:bold}input,textarea,select{width:100%;font:inherit;padding:12px;border:1px solid #c6d6dd;border-radius:12px;background:white}h2{font-size:17px;margin:9px 0}p{line-height:1.45}.map{height:320px;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(145deg,#e0e9d4,#d5e4d5)}.map:before{content:'';position:absolute;inset:-25%;background:repeating-linear-gradient(35deg,transparent 0 38px,#fff 40px 52px,transparent 54px 100px),repeating-linear-gradient(128deg,transparent 0 49px,#fff 51px 62px,transparent 64px 109px)}.pin{position:absolute;border:3px solid white;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:var(--accent);color:white;font-weight:bold;box-shadow:0 3px 9px #1235}.bubble{max-width:87%;padding:13px;margin:12px 0;border-radius:17px;background:#e9f0f3;font-size:14px;line-height:1.5}.bubble.me{margin-left:auto;background:var(--accent);color:white}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.step{font-size:11px;color:var(--muted);margin:12px 0}@media(max-width:480px){body{background:white}.note{margin:0;border-radius:0;font-size:10px;padding:7px}.phone{border:0;width:100%;height:calc(100dvh - 48px);min-height:400px;margin:0;border-radius:0;box-shadow:none}}:focus-visible{outline:3px solid #f0a158;outline-offset:2px}</style></head><body><div class="note"><b>PROTOTIPO A</b> · Alternativa conceptual con interacciones limitadas. Solo la alternativa C incluye simulación integral. <a href="alternativas.html">Ver comparación</a></div><section class="phone" aria-label="Prototipo móvil A"><header class="head"><h1>Explorar Lima</h1><p>Mapa y reportes cercanos</p></header><div class="body" id="content"></div><nav class="nav" id="nav" aria-label="Navegación de la alternativa"></nav></section><script>const $=x=>document.querySelector(x);let tab='mapa';let selected=0;let district='Todos';const reports=[['Pista dañada','San Martín de Porres','En revisión',12,35,27],['Luminaria apagada','Los Olivos','Reportado',7,71,49],['Basura acumulada','Comas','En atención',18,43,76]];function render(){const items=reports.filter(r=>district==='Todos'||r[1]===district);const map=`<div class="map" aria-label="Mapa esquemático de Lima">${reports.map((r,i)=>`<button class="pin" style="left:${r[4]}%;top:${r[5]}%" onclick="selected=${i};tab='detalle';render()" aria-label="Abrir ${r[0]}">${r[3]}</button>`).join('')}</div>`;const list=items.map((r,i)=>`<div class="card"><b>${r[0]}</b><p class="muted">${r[1]} · ${r[2]} · ${r[3]} apoyos</p><button class="secondary" onclick="selected=${reports.indexOf(r)};tab='detalle';render()">Consultar ficha</button></div>`).join('');const views={mapa:`<div class="row"><span class="chip">Lima Metropolitana</span><span class="chip">Datos simulados</span></div><h2>Explora reportes por ubicación</h2>${map}<p class="muted">Selecciona un marcador para ver la incidencia.</p><button class="primary" onclick="tab='nuevo';render()">+ Iniciar reporte</button>`,lista:`<h2>Reportes de ejemplo</h2><label for="district">Filtrar distrito</label><select id="district" onchange="district=this.value;render()"><option ${district==='Todos'?'selected':''}>Todos</option>${['San Martín de Porres','Los Olivos','Comas'].map(d=>`<option ${district===d?'selected':''}>${d}</option>`).join('')}</select>${list}`,detalle:`<span class="chip">Detalle del mapa</span><h2>${reports[selected][0]}</h2><div class="card"><b>Ubicación</b><p>${reports[selected][1]} (referencia simulada)</p><b>Estado</b><p>${reports[selected][2]}</p><b>Apoyos</b><p>${reports[selected][3]}</p></div><button class="primary" onclick="tab='lista';render()">Ver otros reportes</button>`,nuevo:`<h2>Reporte desde mapa</h2><p class="muted">Pantalla conceptual A: aquí se explora cómo iniciar el reporte desde un lugar. No completa el flujo.</p><div class="card"><label>Problema</label><textarea placeholder="Describe brevemente el problema"></textarea><label>Distrito</label><input value="San Martín de Porres" readonly></div><button class="primary" onclick="tab='mapa';render()">Volver al mapa</button>`};$('#content').innerHTML=views[tab];$('#nav').innerHTML=[['mapa','Mapa'],['lista','Lista'],['nuevo','Reportar']].map(([key,label])=>`<button class="${tab===key?'active':''}" onclick="tab='${key}';render()">${label}</button>`).join('')}render();</script></body></html>
